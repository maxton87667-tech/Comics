<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Comic Pur - We Have Moved!</title>

  <meta http-equiv="refresh" content="5;url=https://comic-pur.maxton87667.workers.dev/" />

  <style>
    :root {
      --primary: #00d4ff;
      --accent: #ff69b4;
      --dark: #0a001f;
      --glow: rgba(0, 212, 255, 0.7);
    }

    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }

    body {
      background: linear-gradient(135deg, var(--dark), #1a003f);
      color: white;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    header {
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(10, 0, 31, 0.92);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(0, 212, 255, 0.35);
      height: 64px;
    }

    .logo img {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 3px solid var(--primary);
      box-shadow: 0 0 20px var(--glow);
      object-fit: cover;
    }

    .heading-img {
      max-width: 220px;
    }

    /* REDIRECT CONTAINER */
    .container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .redirect-card {
      background: rgba(10, 0, 31, 0.85);
      border: 2px solid var(--primary);
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 35px var(--glow);
      backdrop-filter: blur(10px);
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    .icon {
      font-size: 64px;
      margin-bottom: 15px;
      filter: drop-shadow(0 0 15px var(--accent));
    }

    h1 {
      font-size: 26px;
      color: var(--primary);
      margin-bottom: 12px;
      text-shadow: 0 0 10px var(--glow);
    }

    p {
      color: #dddddd;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    /* NEW SITE BUTTON */
    .redirect-btn {
      display: inline-block;
      width: 80%;
      padding: 14px 28px;
      border-radius: 12px;
      background: linear-gradient(45deg, var(--primary), var(--accent));
      color: white;
      font-weight: bold;
      font-size: 18px;
      text-decoration: none;
      box-shadow: 0 0 20px var(--glow);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .redirect-btn:hover {
      transform: scale(1.05) translateY(-2px);
      box-shadow: 0 0 30px var(--accent);
    }

    .timer {
      margin-top: 25px;
      font-size: 13px;
      color: #aaaaaa;
    }

    .timer span {
      color: var(--primary);
      font-weight: bold;
      font-size: 15px;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">
      <img src="https://maxton87667-tech.github.io/Comics/assets/heading.png" alt="Logo">
    </div>

    <img src="https://maxton87667-tech.github.io/Comics/assets/logo-circle.png" class="heading-img" alt="Comic Pur">

    <div style="width: 52px;"></div>
  </header>

  <div class="container">
    <div class="redirect-card">
      <div class="icon">🚀</div>
      <h1>We Have Transferred!</h1>
      <p>Comic Pur has moved to a brand new website with a much better reading experience and faster loading. Welcome to our new home!</p>
      
      <a href="https://comic-pur.maxton87667.workers.dev/" class="redirect-btn">Go to New Website</a>
      
      <div class="timer">Redirecting automatically in <span id="countdown">5</span> seconds...</div>
    </div>
  </div>

  <script>
    // Automatic Countdown & Redirect Script
    let seconds = 5;
    const countdownEl = document.getElementById('countdown');
    const newSiteURL = "https://comic-pur.maxton87667.workers.dev/";

    const interval = setInterval(() => {
      seconds--;
      if (countdownEl) {
        countdownEl.textContent = seconds;
      }
      if (seconds <= 0) {
        clearInterval(interval);
        window.location.href = newSiteURL;
      }
    }, 1000);
  </script>

</body>
</html>
